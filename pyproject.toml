[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.publish]
tests = false

[project]
name = "dynamicforms"
version = "0.83.0"
description = "Tombstone release. This package has been retired; no code is included."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Proprietary" }
authors = [
    { name = "Jure Erznožnik", email = "support@velis.si" },
]
classifiers = [
    "Development Status :: 7 - Inactive",
    "Programming Language :: Python :: 3",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/velis74/DynamicForms"
Repository = "https://github.com/velis74/DynamicForms"

[tool.hatch.build.targets.wheel]
packages = ["dynamicforms"]

[tool.hatch.build.targets.sdist]
include = ["/dynamicforms", "/README.md", "/LICENSE"]
